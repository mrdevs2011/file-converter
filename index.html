<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e24a3b">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <title>File Converter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="top">
      <div class="logo">
        <img class="logo-mark" src="favicon.svg" width="48" height="48" alt="">
        <div>
          <h1>File Converter</h1>
          <p class="tag">JSON · Excel · CSV · YAML · XML · TOML · SQL · INI · Markdown</p>
        </div>
      </div>
    </header>

    <main class="frame">
      <div class="upload" id="drop" tabindex="0" role="button" aria-label="Fayl yuklash">
        <div class="upload-icon" aria-hidden="true">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 16V4M12 4l-4 4M12 4l4 4"/>
            <path d="M4 14v4a2 2 0 002 2h12a2 2 0 002-2v-4"/>
          </svg>
        </div>
        <h2>Faylni shu yerga tashlang</h2>
        <p>yoki bosing · <kbd>Ctrl</kbd>+<kbd>V</kbd></p>
        <div class="chips" id="fileChips"></div>
        <small id="fileName" class="sr-only"></small>
      </div>
      <input id="file" type="file" multiple accept=".json,.jsonl,.ndjson,.csv,.tsv,.txt,.xlsx,.xls,.xlsm,.xlsb,.ods,.yaml,.yml,.xml,.html,.htm,.md,.markdown,.toml,.ini,.conf,.cfg,.properties,.sql,.log">

      <div class="work">
        <div class="actions">
          <div class="field">
            <label for="fmt">Chiqish formati</label>
            <select id="fmt" aria-label="Output format">
              <option value="xlsx">Excel — .xlsx</option>
              <option value="ods">ODS — .ods</option>
              <option value="csv">CSV — .csv</option>
              <option value="tsv">TSV — .tsv</option>
              <option value="json">JSON — .json</option>
              <option value="jsonl">JSONL — .jsonl</option>
              <option value="yaml">YAML — .yaml</option>
              <option value="xml">XML — .xml</option>
              <option value="html">HTML — .html</option>
              <option value="md">Markdown — .md</option>
              <option value="toml">TOML — .toml</option>
              <option value="ini">INI — .ini</option>
              <option value="sql">SQL — .sql</option>
              <option value="log">LOG — .log</option>
            </select>
          </div>
          <button class="go" id="go" disabled>
            <span class="go-text">Convert</span>
            <span class="go-spin" aria-hidden="true"></span>
          </button>
        </div>

        <div class="result" id="result" aria-live="polite">
          <div class="empty-hint">
            <p>Convert qilingandan keyin preview shu yerda chiqadi</p>
          </div>
        </div>
      </div>
    </main>

    <footer class="foot">
      <span>Offline · kutubxonalar local</span>
      <span>Bir nechta fayl birga merge bo‘ladi</span>
    </footer>
  </div>

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="vendor/papaparse.min.js"></script>
  <script src="vendor/js-yaml.min.js"></script>
  <script src="converter.js"></script>
  <script src="app.js"></script>
</body>
</html>
